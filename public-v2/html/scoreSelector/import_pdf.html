<div class="preview" id="preview">
  <div class="preview-empty" id="preview-empty">
    Sélectionnez une partition dans la liste<br>ou importez-en une nouvelle ci-dessous.
  </div>
</div>

<div style="padding: 0 20px 16px;">
  <div class="drop" id="drop">
    <input type="file" id="file-input" accept=".pdf,.musicxml,.xml,.mxl" />
    <div class="drop-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 4v12M7 11l5 5 5-5"/><path d="M5 20h14"/></svg>
    </div>
    <div>
      <div class="drop-title">Glissez un PDF ici</div>
      <div class="drop-sub">ou cliquez pour parcourir vos fichiers</div>
    </div>
    <button id="browse-btn">Parcourir...</button>
  </div>
</div>
