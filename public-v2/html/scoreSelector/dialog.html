<!-- Faded background hint of the main app -->
<div class="bg-hint">
  <div class="sb"></div>
  <div class="topbar"></div>
  <div class="book"></div>
</div>
<div class="dim"></div>

<div class="modal" role="dialog" aria-modal="true">

  <!-- Header -->
  <div class="modal-head">
    <div>
      <div class="title">Choisir une Partition</div>
      <div class="sub">Sélectionnez une partition dans votre bibliothèque ou importez-en une nouvelle</div>
    </div>
    <button class="close-btn" title="Fermer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <!-- Body -->
  <div class="modal-body">
    <!-- Left pane (selector) loaded here -->
    <div class="tree-pane" id="selector-slot"></div>
    <!-- Right pane (import_pdf) loaded here -->
    <div class="import-pane" id="import-slot"></div>
  </div>

  <!-- Footer -->
  <div class="modal-foot">
    <div class="foot-info" id="foot-info">Aucune partition sélectionnée</div>
    <div class="foot-actions">
      <button class="btn btn-ghost">Annuler</button>
      <button class="btn btn-primary" id="launch-btn" disabled>
        Ouvrir la partition
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
  </div>

</div>

<!-- Launch transition -->
<div class="launch" id="launch">
  <div class="clef">𝄞</div>
  <div>
    <div class="name" id="launch-name">Quatuor n°14, op. 131</div>
    <div class="author" id="launch-author">Ludwig van Beethoven</div>
  </div>
  <div class="ld">Ouverture sur Mouvement <span style="font-family:var(--serif);font-style:italic;font-weight:600">I</span></div>
  <div class="dots"><span></span><span></span><span></span></div>
</div>
