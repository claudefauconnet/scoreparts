<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>ScoreParts — Choisir une partition</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Pinyon+Script&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/scoreSelector/dialog.css">
<link rel="stylesheet" href="/css/scoreSelector/selector.css">
<link rel="stylesheet" href="/css/scoreSelector/import_pdf.css">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
</head>
<body>

<div id="dialog-host"></div>

<script>
$(function () {
  $('#dialog-host').load('/html/scoreSelector/dialog.html', function () {
    $.when(
      $('#selector-slot').load('/html/scoreSelector/selector.html'),
      $('#import-slot').load('/html/scoreSelector/import_pdf.html')
    ).done(function () {
      // Load JS modules now that all fragments exist in DOM.
      ['dialog', 'selector', 'import_pdf'].forEach(function (name) {
        var s = document.createElement('script');
        s.type = 'module';
        s.src = '/js/scoreSelector/' + name + '.js';
        document.body.appendChild(s);
      });
    });
  });
});
</script>
</body>
</html>
