<div class="section-label">Actions</div>
<div class="tool-row">
  <button class="tool-btn" id="act-new-zone" data-tooltip="New zone" data-tooltip-sub="Mode persistant : chaque clic dans le vide crée une zone rattachée au mouvement courant. Cliquez une zone existante pour la déplacer, redimensionner ou supprimer sans quitter le mode.">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><rect x="4" y="4" width="12" height="12" rx="1" stroke-dasharray="3 2"/><path d="M18 14v6M15 17h6"/></svg>
    New zone
  </button>
  <button class="tool-btn" id="act-measure" data-tooltip="Numéro de mesure" data-tooltip-sub="Cliquez n'importe où pour poser un numéro de mesure (répété au-dessus de chaque zone de la page). Glissez chaque badge pour le repositionner (x, y) sans recouvrir les notes. Survolez un badge et cliquez sa croix pour tout effacer.">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><path d="M12 4v16"/><path d="M6 8h3M6 12h2M6 16h3M15 8h3M16 12h2M15 16h3"/></svg>
    Mesure
  </button>
  <button class="tool-btn" id="act-text" data-tooltip="Texte" data-tooltip-sub="Cliquez n'importe où pour poser un texte (répété au-dessus de chaque zone du système visé). Glissez chaque badge pour le repositionner, sa poignée bas-droite pour changer la taille, survolez-le et cliquez sa croix pour l'effacer.">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><path d="M5 6h14M12 6v13M9 19h6"/></svg>
    Texte
  </button>
  <button class="tool-btn" id="act-auto-detect" data-tooltip="Auto-detect zones" data-tooltip-sub="Analyse la partition et place automatiquement une zone par système musical sur les pages visibles.">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><path d="M3 7h2M3 12h2M3 17h2M7 5h14v3H7zM7 10.5h14v3H7zM7 16h14v3H7z"/><circle cx="19" cy="6.5" r="1" fill="currentColor"/></svg>
    Auto-detect
  </button>
  <button class="tool-btn" id="act-duplicate" data-tooltip="Dupliquer la page précédente" data-tooltip-sub="Copie toutes les zones et leurs attributions de voix depuis la page précédente vers la page courante.">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><rect x="8" y="3" width="12" height="14" rx="1"/><path d="M16 7H4v14h12v-4"/></svg>
    Dupliquer
  </button>
</div>
