<div class="section-label">Actions</div>
<div class="tool-row">
  <button class="tool-btn" id="act-new-zone" data-tooltip="New zone" data-tooltip-sub="Au prochain clic sur une page, une nouvelle zone sera créée et attribuée à la voix active.">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><rect x="4" y="4" width="12" height="12" rx="1" stroke-dasharray="3 2"/><path d="M18 14v6M15 17h6"/></svg>
    New zone
  </button>
  <button class="tool-btn" id="act-auto-detect" data-tooltip="Auto-detect zones" data-tooltip-sub="Analyse la partition et place automatiquement une zone par système musical sur les pages visibles.">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><path d="M3 7h2M3 12h2M3 17h2M7 5h14v3H7zM7 10.5h14v3H7zM7 16h14v3H7z"/><circle cx="19" cy="6.5" r="1" fill="currentColor"/></svg>
    Auto-detect
  </button>
  <button class="tool-btn" id="act-duplicate" data-tooltip="Dupliquer la page précédente" data-tooltip-sub="Copie toutes les zones et leurs attributions de voix depuis la page précédente vers la page courante.">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><rect x="8" y="3" width="12" height="14" rx="1"/><path d="M16 7H4v14h12v-4"/></svg>
    Dupliquer
  </button>
  <button class="tool-btn" id="act-auto-assign" data-tooltip="Auto-attribution" data-tooltip-sub="Attribue automatiquement et intelligemment les voix renseignées aux zones existantes du mouvement courant (équivalent de l'ancien onglet Générer voix).">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><path d="M5 19l8-8M11 3l1 3 3 1-3 1-1 3-1-3-3-1 3-1 1-3zM17 13l.7 1.8L19.5 16l-1.8.7L17 18.5l-.7-1.8L14.5 16l1.8-.7L17 13z"/></svg>
    Auto-attribuer
  </button>
</div>
