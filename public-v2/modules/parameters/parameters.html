<div class="tweaks-panel" id="tweaks-panel">
  <h4>Paramètres</h4>

  <div class="tweak-label">Hauteur du rectangle (px)</div>
  <div style="display:flex; align-items:center; gap:8px;">
    <button class="mini-step" id="rect-minus" style="width:28px;height:28px;border:1px solid var(--line);background:white;border-radius:6px;cursor:pointer;font-size:14px;">−</button>
    <input id="rect-h" type="number" min="10" max="200" step="1" value="40" style="flex:1;padding:6px 10px;border:1px solid var(--line);border-radius:6px;font-family:var(--mono);font-size:13px;text-align:center;" />
    <button class="mini-step" id="rect-plus" style="width:28px;height:28px;border:1px solid var(--line);background:white;border-radius:6px;cursor:pointer;font-size:14px;">+</button>
  </div>

  <div class="tweak-label">Style du livre</div>
  <div class="tweak-radio" id="tw-book-style">
    <button data-val="realistic" class="active">Réaliste</button>
    <button data-val="minimal">Minimaliste</button>
    <button data-val="flat">Plat</button>
  </div>

  <div class="tweak-label">État</div>
  <div class="tweak-row" id="tw-state">
    <button data-val="loaded" class="active">Chargée</button>
    <button data-val="empty">Aucune partition</button>
  </div>
</div>
