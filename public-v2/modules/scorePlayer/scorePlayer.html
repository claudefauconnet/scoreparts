<div class="pending-banner pending-banner--zone">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <rect x="3" y="4" width="14" height="12" rx="1" stroke-dasharray="3 2" />
    <path d="M19 14v6M16 17h6" />
  </svg>
  Clic dans le vide : nouvelle zone
  <button id="cancel-new-zone">Annuler</button>
</div>
<div class="pending-banner pending-banner--measure">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
    <path d="M12 4v16" />
    <path d="M6 8h3M6 12h2M6 16h3M15 8h3M16 12h2M15 16h3" />
  </svg>
  Cliquez sur un système pour poser un numéro de mesure
  <button id="cancel-measure">Annuler</button>
</div>
<div class="pending-banner pending-banner--text">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
    <path d="M5 6h14M12 6v13M9 19h6" />
  </svg>
  Cliquez sur un système pour poser un texte
  <button id="cancel-text">Annuler</button>
</div>

<!-- ===================== BOOK (loaded state) ===================== -->
<div class="book" id="book">
  <!-- Left page -->
  <div class="page page-left" data-side="0">
    <div class="sheet">
      <div class="systems" id="systems-left"></div>
    </div>
    <!-- Transparent overlay : Paper.js dessine les zones de cette page ici -->
    <canvas class="zone-canvas" id="canvas-left"></canvas>
    <button class="clear-zones-btn" title="Effacer les zones de cette page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
        <path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6" />
      </svg>
    </button>
    <button class="select-all-zones-btn" title="Sélectionner toutes les zones de cette page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
        <rect x="4" y="4" width="16" height="16" rx="2" stroke-dasharray="3 2" />
        <path d="M9 12l2 2 4-4" />
      </svg>
    </button>
    <button class="debug-download-png-btn" title="Télécharger le PNG de cette page (diagnostic)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
        <polyline points="7 10 12 15 17 10" />
        <line x1="12" y1="15" x2="12" y2="3" />
      </svg>
    </button>
  </div>

  <!-- Right page -->
  <div class="page page-right" data-side="1">
    <div class="sheet">
      <div class="systems" id="systems-right"></div>
    </div>
    <canvas class="zone-canvas" id="canvas-right"></canvas>
    <button class="clear-zones-btn" title="Effacer les zones de cette page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
        <path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6" />
      </svg>
    </button>
    <button class="select-all-zones-btn" title="Sélectionner toutes les zones de cette page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
        <rect x="4" y="4" width="16" height="16" rx="2" stroke-dasharray="3 2" />
        <path d="M9 12l2 2 4-4" />
      </svg>
    </button>
    <button class="debug-download-png-btn" title="Télécharger le PNG de cette page (diagnostic)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
        <polyline points="7 10 12 15 17 10" />
        <line x1="12" y1="15" x2="12" y2="3" />
      </svg>
    </button>
  </div>

  <div class="spine"></div>
</div>

<!-- Lateral arrows -->
<button class="nav-arrow prev" title="Page précédente">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
    <path d="M15 6l-6 6 6 6" />
  </svg>
</button>
<button class="nav-arrow next" title="Page suivante">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
    <path d="M9 6l6 6-6 6" />
  </svg>
</button>

<!-- Multi-select toolbar -->
<div class="multiselect-toolbar" id="multiselect-toolbar" style="display: none">
  <span class="multiselect-count" id="multiselect-count">0 zones</span>
  <div class="multiselect-divider"></div>
  <button
    class="multiselect-btn"
    id="multiselect-move"
    title="Déplacer : glissez une zone sélectionnée"
  >
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M12 3v18M3 12h18" />
      <path d="M12 3l-3 3m3-3 3 3M12 21l-3-3m3 3 3-3M3 12l3-3m-3 3 3 3M21 12l-3-3m3 3-3 3" />
    </svg>
  </button>
  <button
    class="multiselect-btn multiselect-btn--delete"
    id="multiselect-delete"
    title="Supprimer les zones sélectionnées"
  >
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
      <path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6" />
    </svg>
  </button>
</div>

<!-- Zoom controls -->
<div class="zoom-controls" id="zoom-controls">
  <button class="zoom-btn" id="zoom-in" title="Zoom avant">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <circle cx="11" cy="11" r="7" />
      <path d="M11 8v6M8 11h6M20 20l-3.5-3.5" />
    </svg>
  </button>
  <button class="zoom-reset" id="zoom-reset" title="Réinitialiser le zoom">100%</button>
  <button class="zoom-btn" id="zoom-out" title="Zoom arrière">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <circle cx="11" cy="11" r="7" />
      <path d="M8 11h6M20 20l-3.5-3.5" />
    </svg>
  </button>
</div>
