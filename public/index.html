<!DOCTYPE html>
<html lang="en">


<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta charset="utf-8">
    <title>ScoreParts</title>

    <link rel="stylesheet" media="screen" type="text/css" title="Design" href="./css/index.css"/>
    <link rel="stylesheet" media="print" type="text/css" title="Design" href="./css/index.css"/>

    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jstree/3.2.1/themes/default/style.min.css" />

    <script src="./js/jquery/jquery.js"></script>
    <script src="./js/jquery/jquery-ui.min.js"></script>
    <script src="./js/jquery/jquery.printElement.js"></script>
    <script src="./js/scoreParts.js" charset="UTF-8"></script>
    <script src="./js/proxy.js" charset="UTF-8"></script>
    <script src="./js/voices.js" charset="UTF-8"></script>
    <script src="./js/common.js" charset="UTF-8"></script>
    <script src="./js/async.js" charset="UTF-8"></script>
    <script type="module" src="./js/jstreeWidget.js"></script>

    <script  src="./js/jsTree/jstree.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/paper@0.12.18/dist/paper-full.min.js"></script>
    <script src="./js/paper.js" charset="UTF-8"></script>



    <style>
        body {
            font-family: Verdana, Arial, sans-serif;
        }

        tr {
            margin: 2px;
            padding: 2px;
            text-align: center;

        }

        button {
            margin: 10px;
            font-size: 14px;
            font-weight: normal;
        }

        #imageSplitterDiv {
            top: 50px;
            left: 400px;
            position: absolute;
            width: 592px;
        }

        #controlPanelDiv {
            top: 50px;
            left: 10px;
            position: absolute;
        }


        .dragRect {
            border-width: 1px;
            border-color: black;
            border-style: dashed;
            background-color: transparent;
        }

        #importDiv {
            visibility: hidden;
            background-color: #F9B154;
            margin: 5px;
        }

        #scrappingCommandsDiv {
            visibility: hidden;
        }

        #page {
            font-size: 14px;
            font-weight: bold;
            color: orange;
        }

        .textSmall {
            font-size: 14px;
            font-weight: normal;
            color: black;

        }

        #message {
            font-size: 14px;
            font-style: italic;
            color: black;
            width: 350px;
            height: 200px;
            overflow: auto;

        }

        .buttonImportant {

            background-color: #fcefa1;
        }


    </style>

    <script>
        var currentPage = 0;
        var currentZoneInPage = 0;
        $(function () {
            Proxy.listScores();

            $("#mainDialogDiv").dialog({
                autoOpen: false,
                height: "auto",
                width: "auto",
                modal: false,
                position: { my: "center", at: "center", of: window },
                open: function (event, ui) {
                    //  $("#mainDialogDiv").css("width","80%")
                },
            });


        });


    </script>


</head>

<body>


<table>
    <tr>
        <td>
            <input type="image" onclick='scoreParts.getInfos()' width="20px" src="images/infos.png">
            Ouvrir partition : <select id="scoresSelect" onchange="scoreParts.openFirstPdfPage('')">
            <option>&nbsp;</option>
        </select>
        </td>

        <td>
            <button id=importButton" onclick="$('#importDiv').css('visibility','visible');">Importer PDF...</button>
        </td>
        <td>
            <div id="importDiv">


                <form enctype="multipart/form-data" id="uploadForm">

                    <input type="file" name="pdfFile" id="pdfFileInput" onchange="Proxy.uploadFormData()">
                    Qualite <select name="imageQuality">
                    <option value="low">faible</option>
                    <option value="medium" selected>moyenne</option>
                    <option value="high">haute</option>
                </select>

                </form>

            </div>
        </td>
    </tr>
    <tr>
        <td>
            &nbsp;
        </td>
    </tr>
</table>
<div style="display: flex;flex-direction: row">

    <div id="controlPanelDivxxx" style="width:400px;height:600px;visibility: visible">
        <td><img src="images/waitAnimated.gif" id="waitImg" width="20px" style="visibility: hidden"></td>
        <div id="message"></div>
        <table>
            <tr>
                <td>
                    page<span id="page"></span>


                </td>
            </tr>

            <tr>
                <td>
                    <div id="mousePositionDiv"></div>
                    <button onclick="scoreParts.previousPage()">page précédente</button>
                    <button onclick="scoreParts.nextPage()">page suivante</button>
                </td>
            </tr>
            <tr>
                <td>
                    hauteur zone<input id="zoneHeight" value="50" size="3">

                    <br>
                        <button onclick="Proxy.autoDetectPageZones()" style="visibility: visible"
                                  id="duplicateZonesButton2">autoDetect Zones
                          </button>
                    <button onclick="scoreParts.registerZoneVoices(this)" style="visibility: hidden"
                            id="duplicateZonesButton">enregister Zones
                    </button>
                    <button onclick="scoreParts.repeatZonesFromPreviousPage(this)" style="visibility: visible">répéter Zones
                    </button>



                </td>
            </tr>
            <tr>
                <td>

                    &nbsp;&nbsp;
                    <button onclick=scoreParts.restartAll()>tout recommencer</button>
                    <button onclick=scoreParts.deletePageZones()>effacer Page</button>
                </td>
            </tr>
            <tr>
                <td>


                    <button class="buttonImportant" id="generatePartButton" style="visibility:visible"
                            onclick=" Voices.showVoicesDialog()">Générer multiples voix (pdf)

                    </button>
                    <button class="buttonImportant" id="generatePartButton" style="visibility:visible"
                            onclick="Proxy.generateInstrumentScore()">Générer simple voix (pdf)

                    </button>
                </td>
            </tr>
            <tr>

            </tr>
            <tr>
                <td colspan="3"></td>
            </tr>
        </table>




    </div>



<div id="imageSplitterDivXX" style="width:400px;visibility: visible">
    <canvas id="myCanvas" style="position:relative;top:0;left:0">


    </canvas>

</div>
<div id="mainDialogDiv"></div>

</div>

</body>
